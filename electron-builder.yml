appId: io.vpsmanager.desktop
productName: VPS Manager
copyright: Copyright © 2026 Nuranova Solutions
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: resources/icon.ico
  target: nsis
  executableName: VPS Manager
  artifactName: VPS-Manager-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
